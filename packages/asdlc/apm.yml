name: asdlc
version: 0.1.0
description: "Agentic SDLC bundle: refine an idea with ideation and to-idea, grill the plan with grill-me, write it up with to-spec, break it into tickets with to-tickets, then build each ticket test-first with tdd."
author: Michael Gurevich
license: MIT
dependencies:
  apm:
    - MichaelGurevich/my-apm/packages/ideation
    - MichaelGurevich/my-apm/packages/grill-me
    - MichaelGurevich/my-apm/packages/to-spec
    - MichaelGurevich/my-apm/packages/to-tickets
    - MichaelGurevich/my-apm/packages/tdd
  mcp: []
includes: auto
scripts: {}
